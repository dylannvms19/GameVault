<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
    <title>Catálogo de Juegos — GameVault</title>
    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="text-gradient">Catálogo de Juegos</h2>
            <a th:href="@{/juegos/nuevo}" class="btn btn-primary">+ Nuevo Juego</a>
        </div>

        <div class="grid">
            <div class="panel" th:each="juego : ${juegos}" style="padding: 0; overflow: hidden;">

                <img th:src="${#strings.startsWith(juego.portadaUrl, 'http')} ? ${juego.portadaUrl} : @{/uploads/{img}(img=${juego.portadaUrl})}"
                     alt="Portada"
                     style="width: 100%; height: 300px; object-fit: cover; display: block;"
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/300x400?text=Sin+Imagen'"/>

                <div style="padding: 20px;">
                    <!-- 'th:text' sobrescribe el texto que hay adentro de la etiqueta HTML -->
                    <h3 th:text="${juego.titulo}" style="margin-top: 0; margin-bottom: 10px;">Título del Juego</h3>
                    <p th:text="${juego.descripcion}" style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin: 0;">Descripción breve del juego.</p>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(juegos)}" style="grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--text-muted);">
                No hay juegos en la bóveda aún. ¡Sé el primero en subir uno!
            </div>
        </div>
    </main>
</th:block>
